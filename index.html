<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nox</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div id="inline-stream-layer" class="fullscreen-player-layer" style="display: none;">
        <div class="player-control-header">
            <button class="close-stream-btn" onclick="closeStreamPortal()">← Back</button>
            <span id="active-stream-title"></span>
        </div>
        <div class="stream-frame-container">
            <iframe id="nox-secure-iframe" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals" allowfullscreen></iframe>
        </div>
    </div>

    <div class="app-shell">
        <aside class="left-sidebar">
            <div class="brand" onclick="switchTab('home-section', document.getElementById('nav-home'))">
                <span class="brand-icon">N</span> NOX
            </div>

            <nav class="side-nav">
                <button id="nav-home" class="nav-tab-btn active" onclick="switchTab('home-section', this)">Home</button>
                <button id="nav-games" class="nav-tab-btn" onclick="switchTab('games-section', this)">Library <span class="nav-badge" id="total-games-badge">800+</span></button>
                <button class="nav-tab-btn" onclick="switchTab('anime-section', this)">Anime</button>
                <button class="nav-tab-btn" onclick="switchTab('manga-section', this)">Manga</button>
                <button class="nav-tab-btn" onclick="switchTab('video-section', this)">Videos</button>
                <button class="nav-tab-btn" onclick="launchRandomGame()">Random</button>
            </nav>

            <div class="sidebar-promo-card">
                <div class="promo-title">Full Collection</div>
                <p>Browse all titles and manage your saved favorites.</p>
                <button class="promo-btn" onclick="switchTab('games-section', document.getElementById('nav-games'))">Go to library</button>
            </div>
        </aside>

        <main class="main-stage">
            <header class="top-search-bar">
                <input type="text" id="global-search" placeholder="Search..." onkeyup="handleGlobalSearch(this.value)" class="search-input">
                <button class="pill-btn" id="fav-filter-btn" onclick="toggleFavoritesFilter()">★ Favorites</button>
            </header>

            <div id="home-section" class="tab-content">
                <div class="hero-carousel-wrapper">
                    <div class="hero-banner" id="hero-banner">
                        <button class="hero-arrow prev" onclick="cycleHero(-1)">‹</button>
                        <button class="hero-arrow next" onclick="cycleHero(1)">›</button>

                        <div class="hero-tags" id="hero-tags"></div>
                        <h1 class="hero-title" id="hero-title">Hollow Knight</h1>
                        <p class="hero-desc" id="hero-desc"></p>
                        <div class="hero-meta" id="hero-meta"></div>

                        <div class="hero-actions">
                            <button class="hero-play-btn" id="hero-play-btn">Play Now</button>
                            <button class="hero-secondary-btn" onclick="switchTab('games-section', document.getElementById('nav-games'))">+ Library</button>
                        </div>
                    </div>

                    <div class="hero-selector-row" id="hero-selector-row"></div>
                </div>

                <div class="home-bottom-split">
                    <div class="featured-column">
                        <div class="section-header">
                            <h2><span class="accent-bar"></span>Trending Now</h2>
                            <button class="text-link-btn" onclick="switchTab('games-section', document.getElementById('nav-games'))">View all →</button>
                        </div>
                        <div class="featured-cards-row" id="featured-games-row"></div>
                    </div>

                    <div class="recent-column">
                        <div class="section-header">
                            <h2><span class="accent-bar"></span>Recently Played</h2>
                        </div>
                        <div class="recent-list" id="recent-games-list">
                            <div class="empty-note">Nothing played yet.</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="games-section" class="tab-content" style="display: none;">
                <div class="section-header">
                    <h2><span class="accent-bar"></span>Library</h2>
                </div>
                <div class="media-grid"></div>
            </div>

            <div id="anime-section" class="tab-content" style="display: none;">
                <div class="section-header">
                    <h2><span class="accent-bar"></span>Anime</h2>
                </div>
                <div class="media-grid"></div>
            </div>

            <div id="manga-section" class="tab-content" style="display: none;">
                <div class="section-header">
                    <h2><span class="accent-bar"></span>Manga</h2>
                </div>
                <div class="media-grid"></div>
            </div>

            <div id="video-section" class="tab-content" style="display: none;">
                <div class="section-header">
                    <h2><span class="accent-bar"></span>Videos</h2>
                </div>
                <div class="media-grid"></div>
            </div>
        </main>

        <aside class="right-sidebar">
            <div class="profile-pill">
                <div class="avatar-circle">NX</div>
                <div>
                    <div class="profile-name">Player 1</div>
                    <div class="profile-sub">Online</div>
                </div>
            </div>

            <div class="widget-title">Quick Launch</div>
            <div class="quick-launch-list" id="quick-launch-list"></div>
        </aside>
    </div>

    <script src="./js/games-data.js"></script>
    <script src="./js/streams-data.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
