<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nox</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="top-header">
        <div class="brand" onclick="switchTab('home-section', null)">NOX</div>
        <div class="top-navbar">
            <button class="nav-tab-btn" onclick="switchTab('games-section', this)">Games</button>
            <button class="nav-tab-btn" onclick="switchTab('anime-section', this)">Anime</button>
            <button class="nav-tab-btn" onclick="switchTab('manga-section', this)">Manga</button>
            <button class="nav-tab-btn" onclick="switchTab('video-section', this)">Videos</button>
        </div>
    </div>

    <div class="split-workspace">
        <div class="content-desk">
            
            <div id="inline-stream-layer" class="fullscreen-player-layer" style="display: none;">
                <div class="player-control-header">
                    <button class="close-stream-btn" onclick="closeStreamPortal()">← Exit Player</button>
                    <span id="active-stream-title"></span>
                </div>
                <div class="stream-frame-container">
                    <iframe id="nox-secure-iframe" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals" allowfullscreen></iframe>
                </div>
            </div>

            <div id="home-section" class="tab-content">
                <div class="info-card">
                    <h3>Welcome</h3>
                    <p>Select Games, Anime, Manga, or Videos above to get started.</p>
                </div>
            </div>

            <div id="games-section" class="tab-content" style="display: none;">
                <div class="grid-title">Games Hub</div>
                <input type="text" id="game-search" placeholder="Search 800+ games..." onkeyup="filterGames()" class="search-input">
                <div class="media-grid"></div>
            </div>

            <div id="anime-section" class="tab-content" style="display: none;">
                <div class="grid-title">Anime Portals</div>
                <div class="media-grid"></div>
            </div>

            <div id="manga-section" class="tab-content" style="display: none;">
                <div class="grid-title">Manga Vault</div>
                <div class="media-grid"></div>
            </div>

            <div id="video-section" class="tab-content" style="display: none;">
                <div class="grid-title">Video Mirrors</div>
                <div class="media-grid"></div>
            </div>

        </div>

        <div class="status-sidebar">
            <div>
                <div class="widget-title">System Status</div>
                <div class="status-item">
                    <span>Games Library</span>
                    <div><span class="indicator-dot dot-online"></span></div>
                </div>
                <div class="status-item">
                    <span>Local Players</span>
                    <div><span class="indicator-dot dot-online"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/games-data.js"></script>
    <script src="./js/streams-data.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
